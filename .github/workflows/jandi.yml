name: Update all-branch jandi

on:
  schedule:
    - cron: '17 19 * * *' # 04:17 KST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jandi
  cancel-in-progress: true

jobs:
  update-jandi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate jandi
        env:
          JANDI_OWNER: seungwoo7050
          JANDI_USERNAME: seungwoo7050
          JANDI_INCLUDE_PRIVATE: ${{ vars.JANDI_INCLUDE_PRIVATE }}
          JANDI_TOKEN: ${{ vars.JANDI_INCLUDE_PRIVATE == 'true' && secrets.JANDI_PAT || secrets.GITHUB_TOKEN }}
        run: node scripts/generate-jandi.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet -- assets/jandi.svg; then
            echo "no changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/jandi.svg
          git commit -m "chore: update all-branch jandi"
          git push
